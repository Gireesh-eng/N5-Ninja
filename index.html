    <!-- Theme script to avoid FOUC (Flash of Unstyled Content) -->
    <script>
      (function() {
        // On page load or when changing themes, best to add inline in `head` to avoid FOUC
        const theme = localStorage.theme || 'system';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }

        // Also set color-scheme at the meta tag level for system-level dark mode support
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', theme === 'system' ? 'light dark' : theme);
      })();
    </script>
